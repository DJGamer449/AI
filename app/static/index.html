<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MelanTrance's Private Unlimited AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ink: '#080B12', panel: '#111827' } } } }
  </script>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top_left,#263B80,transparent_35%),linear-gradient(135deg,#06070d,#101827_55%,#07080d)] text-slate-100">
  <div id="login" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4 backdrop-blur-xl hidden">
    <form id="loginForm" class="w-full max-w-md rounded-3xl border border-white/10 bg-white/10 p-8 shadow-2xl">
      <p class="text-sm uppercase tracking-[0.35em] text-cyan-200">Private Access</p>
      <h1 class="mt-3 text-3xl font-bold">MelanTrance's Private Unlimited AI</h1>
      <p class="mt-3 text-sm text-slate-300">Enter the master password to open your secure AI workspace.</p>
      <input id="password" type="password" autocomplete="current-password" placeholder="Master password" class="mt-6 w-full rounded-2xl border border-white/10 bg-black/30 px-4 py-3 outline-none ring-cyan-400/40 focus:ring-4" required />
      <button class="mt-4 w-full rounded-2xl bg-cyan-400 px-4 py-3 font-semibold text-slate-950 transition hover:bg-cyan-300">Unlock</button>
      <p id="loginError" class="mt-4 hidden rounded-xl bg-red-500/20 p-3 text-sm text-red-100"></p>
    </form>
  </div>

  <main class="mx-auto flex min-h-screen max-w-7xl flex-col p-3 lg:p-6">
    <header class="mb-4 flex flex-col gap-3 rounded-3xl border border-white/10 bg-white/10 p-4 shadow-xl backdrop-blur md:flex-row md:items-center md:justify-between">
      <div>
        <p class="text-xs uppercase tracking-[0.3em] text-cyan-200">Secure Orbit Proxy</p>
        <h1 class="text-2xl font-bold md:text-3xl">MelanTrance's Private Unlimited AI</h1>
      </div>
      <div class="flex flex-col gap-2 sm:flex-row sm:items-center">
        <select id="modelSelect" class="min-w-64 rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 text-sm outline-none focus:ring-4 focus:ring-cyan-400/30"></select>
        <button id="refreshModels" class="rounded-2xl border border-white/10 px-4 py-3 text-sm hover:bg-white/10">Refresh</button>
        <button id="logout" class="rounded-2xl bg-white/10 px-4 py-3 text-sm hover:bg-white/20">Logout</button>
      </div>
    </header>

    <section id="messages" class="flex-1 space-y-4 overflow-y-auto rounded-3xl border border-white/10 bg-slate-950/40 p-4 shadow-2xl backdrop-blur"></section>

    <form id="chatForm" class="mt-4 rounded-3xl border border-white/10 bg-white/10 p-3 shadow-xl backdrop-blur">
      <div class="flex gap-3">
        <textarea id="prompt" rows="1" placeholder="Message your private AI..." class="max-h-48 flex-1 resize-none rounded-2xl border border-white/10 bg-slate-950/70 px-4 py-3 outline-none focus:ring-4 focus:ring-cyan-400/30"></textarea>
        <button id="send" class="rounded-2xl bg-gradient-to-r from-cyan-300 to-blue-400 px-6 font-bold text-slate-950 transition hover:scale-[1.02] disabled:cursor-not-allowed disabled:opacity-50">Send</button>
      </div>
      <p class="px-2 pt-2 text-xs text-slate-400">Your API key stays on the server. Conversations are sent only through the authenticated backend proxy.</p>
    </form>
  </main>

  <script src="/assets/app.js"></script>
</body>
</html>
